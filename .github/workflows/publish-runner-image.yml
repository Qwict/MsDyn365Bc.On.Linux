name: Publish signed bc-runner image
# Builds the bc-runner tenant image from feat/multitenant and publishes it to a
# PRIVATE GHCR package, signed with the same cosign key the Qwict control plane
# signs its own releases with. The control plane pins the resulting digest
# (agent/bc-runner.image there) and its updater pulls and verifies it, so a control
# plane release delivers the runner to its agents without a manual image copy.
#
# Tags: the full commit SHA and its first 7 characters (an `rdlc-` prefix for the
# BC_WITH_RDLC=1 variant). The control plane pins digests, never tags.
#
# Needs repository secrets COSIGN_PRIVATE_KEY and COSIGN_PASSWORD. Hosts verify with
# the control plane's committed cosign.pub:
#   cosign verify --key cosign.pub --insecure-ignore-tlog=true <image>@<digest>
on:
  push:
    branches: [feat/multitenant]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-runner-image-${{ github.ref }}
  cancel-in-progress: false

env:
  COSIGN_VERSION: v2.6.5
  COSIGN_SHA256: c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            rdlc: "0"
            prefix: ""
          - variant: rdlc
            rdlc: "1"
            prefix: "rdlc-"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Names
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          {
            echo "IMAGE=ghcr.io/$owner/bc-runner"
            echo "SHORT_SHA=${GITHUB_SHA::7}"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Provenance and SBOM attestations stay off so the pushed digest is the image
      # itself, not an index; the revision label is what the control plane's CI ties
      # its bc-linux.ref pin to.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: BC_WITH_RDLC=${{ matrix.rdlc }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.prefix }}${{ github.sha }}
            ${{ env.IMAGE }}:${{ matrix.prefix }}${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=runner-${{ matrix.variant }}
          cache-to: type=gha,scope=runner-${{ matrix.variant }},mode=max
      - name: Install cosign
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cosign" "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/cosign" /usr/local/bin/cosign
      - name: Sign the digest
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ -z $COSIGN_KEY ]]; then
            echo "::error::Secret COSIGN_PRIVATE_KEY is not set; the image is unsigned and must not be pinned."
            exit 1
          fi
          cosign sign --yes --key env://COSIGN_KEY --tlog-upload=false "$IMAGE@$DIGEST"
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### bc-runner (${{ matrix.variant }})"
            echo
            echo "Pin this in the control plane's \`agent/bc-runner.image\` together with \`agent/bc-linux.ref\` = \`$GITHUB_SHA\`:"
            echo
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
